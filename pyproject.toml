[project]
authors = [{name = "bpben", email = "yksrotab@gmail.com"}]
name = "wheaton_llm_class"
requires-python = ">= 3.10"
version = "0.1.0"
dependencies = [
    "ollama>=0.6.2,<0.7",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-aarch64", "osx-64", "linux-64"]

[tool.pixi.dependencies]
jupyterlab = ">=4.3.5,<5"
pixi-kernel = ">=0.6.1,<0.7"
python = "==3.10"

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.environments.extras]
solve-group = "default"

[tool.pixi.environments.extras.pypi-dependencies]
openai-agents = ">=0.2,<1"
